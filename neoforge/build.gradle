plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    runtimeOnly "maven.modrinth:ae2:${ae2_version}"
    // Use Modrinth version ID (sc43sMLj) instead of version_number to avoid resolving the Fabric build.
    // version_number 19.42.0.385 exists for both neoforge and fabric on Modrinth.
    runtimeOnly "maven.modrinth:jei:sc43sMLj"
    runtimeOnly "maven.modrinth:jade:15.10.5+neoforge"
    // Switched from org.appliedenergistics Maven to Modrinth NeoForge-targeted build (1.21.1).
    runtimeOnly "maven.modrinth:guideme:rduAfwb7"
    runtimeOnly "maven.modrinth:glodium:1.21-2.2-neoforge"
    runtimeOnly "maven.modrinth:extended-ae:1.21-2.2.29-neoforge"
}
