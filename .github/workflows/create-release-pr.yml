name: Create PR to Master

on:
  push:
    branches:
      - 'release/**'
      - 'fix/**'
      - 'hotfix/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR to master
        uses: actions/github-script@v8
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '');

            // Generate human-readable title from branch name
            const suffix = head.replace(/^(release|fix|hotfix)\//, '');
            const prefix = head.startsWith('release/') ? 'Release' :
                           head.startsWith('hotfix/') ? 'Hotfix' : 'Fix';
            const title = `${prefix}: ${suffix}`;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base: 'master',
            });

            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head,
              base: 'master',
              body: [
                `## ${title}`,
                '',
                'This PR was created automatically by the branch push workflow.',
                'Please review the changes and approve to merge.',
                '',
                ':dependabot: This PR was prepared by GitHub Copilot',
              ].join('\n'),
            });

            core.info(`Created PR: #${pr.number} - ${pr.html_url}`);
