name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.tag_check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build all loaders
        if: steps.tag_check.outputs.exists == 'false'
        run: ./gradlew build --console=plain

      - name: Collect release jars
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          mkdir -p release-jars
          find neoforge/build/libs forge/build/libs \
            -name "*.jar" ! -name "*-sources*" ! -name "*-dev*" \
            -exec cp {} release-jars/ \;

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: release-jars/*.jar
          generate_release_notes: true

      - name: Publish to CurseForge and Modrinth
        if: steps.tag_check.outputs.exists == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1631512
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-jars/*.jar
          name: ${{ steps.version.outputs.tag }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            neoforge
            forge
          game-versions: |
            1.21.1
            1.20.1
          fail-on-warning: false

      - name: Create master to develop sync PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:master`,
              base: 'develop',
            });
            if (prs.length > 0) {
              core.info(`Sync PR already exists: #${prs[0].number}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore: sync master to develop',
              head: 'master',
              base: 'develop',
              body: [
                '## Sync master → develop',
                '',
                'This PR was created automatically by the release workflow to sync master back to develop.',
                '',
                ':dependabot: This PR was prepared by GitHub Copilot',
              ].join('\n'),
            });
            core.info(`Created sync PR: #${pr.number}`);
