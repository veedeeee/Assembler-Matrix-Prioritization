name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.tag_check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make gradlew executable
        if: steps.tag_check.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build all loaders
        if: steps.tag_check.outputs.exists == 'false'
        run: ./gradlew build --console=plain

      - name: Collect release jars
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-jars
          if [ "${{ steps.tag_check.outputs.exists }}" = "true" ]; then
            # Tag already exists: download jars from the existing GitHub Release
            gh release download ${{ steps.version.outputs.tag }} \
              --pattern "*.jar" --dir release-jars \
              --repo ${{ github.repository }}
          else
            find neoforge/build/libs forge/build/libs \
              -name "*.jar" ! -name "*-sources*" ! -name "*-dev*" ! -name "*-javadoc*" \
              -exec cp {} release-jars/ \;
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: release-jars/*.jar
          generate_release_notes: true

      - name: Publish NeoForge to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1631512
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-jars/*neoforge*.jar
          name: ${{ steps.version.outputs.tag }}
          version: ${{ steps.version.outputs.version }}-neoforge
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          environment: client | server
          dependencies: |
            ae2 | depends | modrinth:XxWD5pD3
            ae2 | depends | curseforge:223794938
          fail-mode: warn

      - name: Publish Forge to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1631512
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-jars/*forge-1.20*.jar
          name: ${{ steps.version.outputs.tag }}
          version: ${{ steps.version.outputs.version }}-forge
          version-type: release
          loaders: forge
          game-versions: 1.20.1
          environment: client | server
          dependencies: |
            ae2 | depends | modrinth:XxWD5pD3
            ae2 | depends | curseforge:223794938
          fail-mode: warn

      - name: Create master to develop sync PR
        if: always()
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:master`,
              base: 'develop',
            });
            if (prs.length > 0) {
              core.info(`Sync PR already exists: #${prs[0].number}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore: sync master to develop',
              head: 'master',
              base: 'develop',
              body: [
                '## Sync master → develop',
                '',
                'This PR was created automatically by the release workflow to sync master back to develop.',
                '',
                ':dependabot: This PR was prepared by GitHub Copilot',
              ].join('\n'),
            });
            core.info(`Created sync PR: #${pr.number}`);
