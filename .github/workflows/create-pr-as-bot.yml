name: Create PR as Bot

on:
  workflow_dispatch:
    inputs:
      head:
        description: 'Source branch (head)'
        required: true
      base:
        description: 'Target branch (base)'
        required: true
        default: 'master'
      title:
        description: 'PR title'
        required: true
      body:
        description: 'PR body'
        required: false
        default: ':dependabot: This PR was prepared by GitHub Copilot'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR as github-actions[bot]
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = '${{ inputs.head }}';
            const base = '${{ inputs.base }}';

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base,
            });
            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number} - ${prs[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '${{ inputs.title }}',
              head,
              base,
              body: `${{ inputs.body }}`,
            });
            core.info(`Created PR: #${pr.number} - ${pr.html_url}`);
